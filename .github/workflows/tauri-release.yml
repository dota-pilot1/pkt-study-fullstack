name: PKT Study Fullstack Windows Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Windows 설치 파일을 추가할 기존 Release 태그 (예: v0.1.22)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: "PKT Study Fullstack ${{ inputs.release_tag }}"
          releaseBody: "macOS는 로컬에서 직접 빌드·공증하고, Windows NSIS 설치 파일은 수동 Actions 작업으로 추가합니다."
          releaseDraft: false
          prerelease: false
          args: "--bundles nsis"
